<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Parlays">
<meta name="theme-color" content="#0a0f1a">
<link rel="apple-touch-icon" href="icon.png">
<title>Parlay Bot</title>
<style>
:root{
  --bg:#0a0f1a; --card:#121a2b; --card2:#18223a; --line:#24304a; --text:#e8edf7; --dim:#8b97b0;
  --accent:#3ddc84; --accent-d:#1f8f52; --warn:#f5b742; --bad:#ff5d5d; --blue:#5aa9ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(76px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
header{position:sticky;top:0;z-index:5;background:rgba(10,15,26,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:12px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
header h1 .wk{font-size:13px;font-weight:600;color:var(--bg);background:var(--accent);border-radius:6px;padding:2px 7px}
header .sub{color:var(--dim);font-size:12px;margin-top:2px}
main{padding:12px 12px 0;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.game{display:block;color:inherit;text-decoration:none}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.team{font-weight:700;font-size:17px;min-width:44px}
.badge{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:12px;font-weight:800;font-size:14px;background:var(--card2);border:1px solid var(--line)}
.dim{color:var(--dim)} .small{font-size:12px} .tiny{font-size:11px}
.bar{height:6px;border-radius:4px;background:var(--card2);overflow:hidden;display:flex;margin:10px 0 8px}
.bar>div{height:100%}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.pill.q{color:var(--warn);border-color:#5b4a1f}.pill.o{color:var(--bad);border-color:#5c2a2a}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--card2);border-radius:12px;padding:8px 10px}
.kpi b{display:block;font-size:17px}
.kpi span{font-size:11px;color:var(--dim)}
h2{font-size:15px;margin:18px 4px 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px}
button,.btn{font:inherit;color:var(--text);background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
button.primary{background:var(--accent);color:#04210f;border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button:active{transform:scale(.98)}
.legbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legbtns button{text-align:left}
.legbtns button b{display:block}
.legbtns button span{font-size:12px;color:var(--dim)}
.prop{border-top:1px solid var(--line);padding:10px 2px}
.prop:first-child{border-top:none}
.prop .name{font-weight:600}
.prop .exp{margin-top:10px;display:none}
.prop.open .exp{display:block}
.num{font-variant-numeric:tabular-nums}
input[type=number],select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent;padding:8px 4px;font-size:13px}
.seg button.on{background:var(--accent);color:#04210f;font-weight:700}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(10,15,26,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs a{flex:1;text-align:center;color:var(--dim);text-decoration:none;font-size:11px;padding:6px 0;border-radius:10px;position:relative}
.tabs a svg{display:block;margin:0 auto 2px;width:22px;height:22px}
.tabs a.on{color:var(--accent)}
.count{position:absolute;top:0;left:55%;background:var(--accent);color:#04210f;font-weight:800;font-size:10px;border-radius:999px;padding:1px 6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:600;font-size:11px;cursor:pointer;white-space:nowrap}
th.on{color:var(--accent)}
.rk{display:inline-block;min-width:26px;border-radius:6px;padding:1px 4px;text-align:center;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#04210f;font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.ev-pos{color:var(--accent)} .ev-neg{color:var(--bad)}
.back{color:var(--accent);text-decoration:none;font-weight:600;display:inline-block;margin:2px 4px 10px}
.note{font-size:12px;color:var(--dim);margin-top:6px}
.empty{text-align:center;color:var(--dim);padding:40px 16px}
.who{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.who:first-of-type{border-top:none}
.who select{padding:6px 8px;font-size:13px}
details summary{cursor:pointer;color:var(--blue);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.sport{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sport a{color:var(--dim);text-decoration:none;font-size:13px;font-weight:700;padding:6px 12px}
.sport a.on{background:var(--accent);color:#04210f}

:root{--accent:#ffcc4d;--accent-d:#c99a1c}
header h1 .wk,button.primary,.seg button.on,.count,.toast,.sport a.on{color:#2b2000}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.chips button{padding:6px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#2b2000;font-weight:700}
.leg{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.leg:first-child{border-top:none}
.leg .ic{font-size:18px;text-align:center}
.leg .t{font-weight:700;line-height:1.25}
.leg .s{font-size:12px;color:var(--dim)}
.leg .r{text-align:right}
.leg .r b{font-size:16px}
.pc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mult{font-size:26px;font-weight:800;letter-spacing:-.5px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);color:var(--dim)}
.tag.v{color:#3ddc84;border-color:#1f5a3a}
input[type=range]{width:100%;accent-color:var(--accent)}
.lbl{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;margin-top:8px}
.dice{font-size:17px;width:100%;padding:13px;margin-top:12px}
.tier{border-width:2px}
.tier.safe{border-color:#1f5a3a} .tier.med{border-color:#5b4a1f} .tier.lotto{border-color:#5c2a2a}
.tier .hd{font-weight:800;font-size:17px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.scan{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.scan span{font-size:11px;color:var(--dim);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.scan span.old{color:var(--warn);border-color:#5b4a1f}
.foot{font-size:12px;color:var(--dim);margin:0 4px 24px;line-height:1.5}
.foot a{color:var(--blue)}
</style>
</head>
<body>
<header>
  <div class="row between">
    <h1>Parlay Bot <span class="wk">NEXT 12H</span></h1>
    <button class="ghost" id="reload" style="padding:6px 10px;font-size:13px">↻</button>
  </div>
  <div class="sub" id="updated">Loading data…</div>
  <div class="scan" id="scan"></div>
</header>
<main id="app"><div class="empty">Scanning games…</div></main>
<div class="toast" id="toast"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (p,d=0) => Number.isFinite(p) ? (p*100).toFixed(d) + "%" : "—";
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1600); }
function when(iso){ const d=new Date(iso); return isNaN(d) ? "" : d.toLocaleString([], {weekday:"short", hour:"numeric", minute:"2-digit"}); }
function ago(iso){ const m=Math.round((Date.now()-new Date(iso))/60000); return m<1?"just now":m<60?m+" min ago":m<1440?Math.round(m/60)+" h ago":Math.round(m/1440)+" d ago"; }
const clip = (x,a,b) => Math.max(a, Math.min(b, x));
const ord = n => n + (["th","st","nd","rd"][(n%100-20)%10] || ["th","st","nd","rd"][n%100] || "th");
const ICON = {nfl:"🏈", nba:"🏀", tennis:"🎾", soccer:"⚽"};
const NAME = {nfl:"NFL", nba:"NBA", tennis:"Tennis", soccer:"Soccer"};
const STAT = {pts:"points", reb:"rebounds", ast:"assists", fg3:"threes", pass_yds:"pass yds", rush_yds:"rush yds", rec_yds:"rec yds"};
const WINDOW_H = 12, MIN_LEAD_MIN = 10, PROP_HAIRCUT = 0.95;

let LEGS = [], DATA = {}, SPORTS = store.get("bot.sports", {nfl:true, nba:true, tennis:true, soccer:true});
let MODE = store.get("bot.mode", "balanced"), LOTTO_N = store.get("bot.lotto", 12);
let TARGET = store.get("picks.target", 2.5), MINP = store.get("picks.min2", 0.55), MAXP = store.get("picks.max2", 0.85);
let ROLL = {}, RAND = null;

// Pricing filter for Kalshi-priced legs (tennis + soccer)
const MODES = {
  value:    {label:"Value only", minEdge:.02,  maxEdge:.18, vol:200, spread:.05, conf:["medium","high"], p7:4, games:30, note:"Only legs where the model beats Kalshi's price by 2+ points, in liquid markets"},
  balanced: {label:"Balanced",   minEdge:-.04, maxEdge:.22, vol:25,  spread:.08, conf:["medium","high"], p7:5, games:15, note:"Strong picks priced fair or better (up to 4 points worse than Kalshi)"},
  wide:     {label:"Everything", minEdge:-.08, maxEdge:.30, vol:0,   spread:.12, conf:["low","medium","high"], p7:6, games:8, note:"Every model favorite with a price, including thin data and low volume"}
};

// one rating for every leg: chance first, price value second; unpriced props take a small penalty
function rate(L){ return L.p + (L.priced ? 0.6 * clip(L.edge, -.05, .12) : -0.02) + (L.bonus || 0); }

// ------------------------------------------------------------------ the 12-hour window
function inWindow(start, generated){
  const t = new Date(start).getTime(), now = Date.now();
  const scan = generated ? Math.min(new Date(generated).getTime(), now) : now;
  return t > now + MIN_LEAD_MIN * 60e3 && t <= scan + WINDOW_H * 3600e3;
}

// ------------------------------------------------------------------ legs per sport
function tennisLegs(d){
  const out = [], F = MODES[MODE];
  for (const m of d.matches || []){
    if (!m.model || !Number.isFinite(m.market?.p_a) || m.live || !F.conf.includes(m.confidence) || !inWindow(m.start, d.generated)) continue;
    const vol = (m.market.a.volume||0) + (m.market.b.volume||0);
    if (vol < F.vol) continue;
    for (const i of [0,1]){
      const me = i ? m.b : m.a, op = i ? m.a : m.b;
      const p = i ? 1 - m.model.p_a : m.model.p_a;
      const ask = (i ? m.market.b : m.market.a).ask, q = i ? 1 - m.market.p_a : m.market.p_a;
      if (!ask || ask <= 0 || ask >= 0.99 || p < 0.5) continue;
      const edge = p - q;
      if (edge < F.minEdge || edge > F.maxEdge || (me.played_7d||0) > F.p7 || Math.min(me.matches||0, op.matches||0) < F.games) continue;
      const sv = me.serve || {}, so = op.serve || {}, why = [];
      if (me.rank && op.rank) why.push(`rank ${me.rank} vs ${op.rank}`);
      if (me.surface_record) why.push(`${m.surface} ${me.surface_record} vs ${op.surface_record}`);
      if (sv.brk && so.brk && sv.brk - so.brk >= .05) why.push(`breaks ${pct(sv.brk)} vs ${pct(so.brk)}`);
      if (sv.hold && so.hold && sv.hold - so.hold >= .05) why.push(`holds ${pct(sv.hold)} vs ${pct(so.hold)}`);
      why.push(`form ${me.last10} vs ${op.last10}`);
      if ((op.played_7d||0) >= 4) why.push(`opp played ${op.played_7d} in 7d`);
      why.push(edge >= .02 ? `value +${(edge*100).toFixed(0)} pts` : "fair price");
      const bonus = {high:.01, medium:0, low:-.03}[m.confidence] - Math.max(0, (me.played_7d||0) - 3) * .02;
      out.push({sport:"tennis", game:"t"+m.event, start:m.start, title:`${m.players[i]} to win`, sub:`vs ${m.players[1-i]} · ${m.level} · ${m.surface}`,
        why: why.join(" · "), p, mult: 1/ask, priced:true, edge, bonus});
    }
  }
  return out;
}
function soccerLegs(d){
  const out = [], F = MODES[MODE];
  for (const m of d.matches || []){
    if (!m.legs?.length || !F.conf.includes(m.confidence) || !inWindow(m.start, d.generated)) continue;
    const H = m.ctx?.home || {}, A = m.ctx?.away || {};
    for (const L of m.legs){
      const edge = L.p - L.q;
      if (L.spread > F.spread || edge < F.minEdge || edge > F.maxEdge || Math.abs(L.p_model - L.q) > .25 || L.p < .5) continue;
      const homeSide = L.label.startsWith(m.home), awaySide = L.label.startsWith(m.away);
      const me = homeSide ? H : awaySide ? A : null, op = homeSide ? A : awaySide ? H : null;
      const why = [];
      if (me && op){
        if (me.pos && op.pos) why.push(`${ord(me.pos)} vs ${ord(op.pos)} in league`);
        if (me.form) why.push(`form ${me.form} vs ${op.form || "?"}`);
        why.push(`scores ${me.gf10} / concedes ${me.ga10} per game`);
        if (me.rest_days && op.rest_days && op.rest_days - me.rest_days <= -2) why.push(`opp rested ${op.rest_days.toFixed(0)} d less`);
      } else {
        why.push(`model xG ${m.model.xg_home}–${m.model.xg_away}`);
        why.push(`${m.home_abbr} ${H.gf10 ?? "?"}/${H.ga10 ?? "?"} · ${m.away_abbr} ${A.gf10 ?? "?"}/${A.ga10 ?? "?"} goals for/against`);
      }
      why.push(`model ${pct(L.p_model)} vs Kalshi ${pct(L.q)}`);
      const title = L.kind === "win" || L.kind === "dc" ? L.label : `${L.label} · ${m.home_abbr || m.home} v ${m.away_abbr || m.away}`;
      out.push({sport:"soccer", game:"s"+m.id, start:m.start, title, sub:`${m.home} vs ${m.away} · ${m.league}`,
        why: why.join(" · "), p: L.p, mult: 1/L.ask, priced:true, edge, bonus: m.confidence === "high" ? .01 : 0});
    }
  }
  return out;
}
function propLegs(d, sport){
  const out = [];
  for (const g of d.games || []){
    if (g.completed || !g.legs || !inWindow(g.date, d.generated)) continue;
    for (const L of g.legs){
      const form = L.l5 != null ? (L.l5 >= L.line ? .01 : -.02) : 0, cushion = L.avg && L.line <= 0.8 * L.avg ? .01 : L.avg && L.line > L.avg ? -.03 : 0;
      out.push({sport, game:sport + g.id, start:g.date, title:`${L.player} ${L.line}+ ${STAT[L.stat]}`, sub:`${L.team} · ${g.label} · starter`,
        why: L.l5 != null ? `season avg ${L.avg} · last 5 ${L.l5}` : `season avg ${L.avg}`, p:L.p, mult: PROP_HAIRCUT / L.p, priced:false, edge:0, bonus: form + cushion});
    }
  }
  return out;
}

// ------------------------------------------------------------------ builders
function combine(legs){
  const p = legs.reduce((a,L) => a*L.p, 1), mult = legs.reduce((a,L) => a*L.mult, 1), priced = legs.every(L => L.priced);
  return {legs, p, mult, priced, ev: priced ? p*mult - 1 : null};
}
// greedy (or weighted-random when roll = true) build: one leg per game until the payout target / leg count is reached
function build({minP, maxP = 0.97, target = Infinity, n = 30, key = rate}, roll = false){
  const cand = LEGS.filter(L => SPORTS[L.sport] && L.p >= minP && L.p <= maxP);
  for (let tries = 0; tries < (roll ? 300 : 1); tries++){
    const order = roll ? cand.map(L => ({L, k: Math.random() ** (1 / Math.max(key(L) - .4, .02))})).sort((a,b) => b.k - a.k).map(x => x.L)
                       : cand.slice().sort((a,b) => key(b) - key(a));
    const used = new Set(), pick = []; let mult = 1;
    for (const L of order){
      if (used.has(L.game)) continue;
      if (Number.isFinite(target) && pick.length && mult * L.mult > target * 1.25) continue;
      pick.push(L); used.add(L.game); mult *= L.mult;
      if (pick.length >= n || mult >= target * 0.95) break;
    }
    const ok = Number.isFinite(target) ? mult >= target * 0.85 : pick.length >= Math.min(n, 4);
    if (ok && pick.length >= 2) return combine(pick);
  }
  return null;
}
const TIERS = {
  safe:  {icon:"🟢", name:"Safe",   cls:"safe",  opt: () => ({minP:.75, target:1.8, n:5}),            note:"Most likely legs (75%+ each) to about 1.8×"},
  med:   {icon:"🟡", name:"Medium", cls:"med",   opt: () => ({minP:.62, target:4, n:8}),              note:"Strong legs (62%+ each) to about 4×"},
  lotto: {icon:"🔴", name:"Lotto",  cls:"lotto", opt: () => ({minP:.6, n:LOTTO_N, key: L => rate(L) + .15*clip(L.edge, -.05, .15)}), note:""}
};

// ------------------------------------------------------------------ views
function legRow(L){
  return `<div class="leg"><div class="ic">${ICON[L.sport]}</div>
    <div><div class="t">${esc(L.title)}</div><div class="s">${esc(L.sub)} · ${esc(when(L.start))}</div><div class="s">${esc(L.why)}</div></div>
    <div class="r"><b class="num">${pct(L.p)}</b><div class="s num">${L.mult.toFixed(2)}× ${L.priced ? "Kalshi" : "est."}</div></div></div>`;
}
function tierCard(k){
  const T = TIERS[k], P = ROLL[k] || build(T.opt());
  const note = k === "lotto" ? `${LOTTO_N} of the most likely legs (60%+ each), value as a tiebreak` : T.note;
  if (!P) return `<div class="card tier ${T.cls}"><div class="hd">${T.icon} ${T.name}</div><div class="note">Not enough legs in the next ${WINDOW_H} hours for this one. Try Everything, or turn more sports on.</div></div>`;
  const txt = P.legs.map(L => `${ICON[L.sport]} ${L.title}`).join("\n");
  const short = k === "lotto" && P.legs.length < LOTTO_N ? ` · only ${P.legs.length} legs qualify right now` : "";
  return `<div class="card tier ${T.cls}">
    <div class="pc-head"><div><div class="hd">${T.icon} ${T.name} · ${P.legs.length} legs</div><div class="s small dim">${esc(note + short)}${ROLL[k] ? " · re-rolled" : ""}</div></div>
      <div style="text-align:right"><div class="mult num">${P.mult.toFixed(2)}×</div><div class="tiny dim">${P.priced ? "at Kalshi asks" : "estimated payout"}</div></div></div>
    <div class="row" style="gap:6px;margin:8px 0 2px;flex-wrap:wrap"><span class="tag">Model hit chance ${pct(P.p)}</span>${P.priced ? `<span class="tag ${P.ev >= 0 ? "v" : ""}">EV ${P.ev >= 0 ? "+" : ""}${(P.ev*100).toFixed(0)}%</span>` : `<span class="tag">Includes props: check Kalshi's combo price</span>`}</div>
    ${P.legs.map(legRow).join("")}
    <div class="btns"><button data-reroll="${k}">🎲 Re-roll</button><button data-copy="${esc(txt)}">Copy legs</button></div></div>`;
}
function render(){
  const inRange = LEGS.filter(L => SPORTS[L.sport]);
  const chips = ["nfl","nba","tennis","soccer"].map(s => `<button data-sport="${s}" class="${SPORTS[s] ? "on" : ""}">${ICON[s]} ${NAME[s]} <span class="dim">${LEGS.filter(L => L.sport===s).length}</span></button>`).join("");
  let html = `<div class="chips">${chips}</div>`;
  html += ["safe","med","lotto"].map(tierCard).join("");
  html += `<div class="card">
    <div style="font-weight:700">Settings</div>
    <div class="lbl"><span>Lotto legs</span><b class="num" id="lv">${LOTTO_N}</b></div>
    <input type="range" min="6" max="15" step="1" value="${LOTTO_N}" id="lotto">
    <div class="lbl"><span>Kalshi-priced legs (tennis, soccer)</span><span></span></div>
    <div class="chips" style="margin:6px 0 4px">${Object.entries(MODES).map(([k,v]) => `<button data-mode="${k}" class="${MODE===k ? "on" : ""}">${v.label}</button>`).join("")}</div>
    <div class="s small dim">${esc(MODES[MODE].note)}</div>
  </div>
  <div class="card">
    <div style="font-weight:700">🎲 Custom randomizer</div>
    <div class="lbl"><span>Target payout</span><b class="num" id="tv">${TARGET.toFixed(2)}×</b></div>
    <input type="range" min="1.3" max="25" step="0.05" value="${TARGET}" id="target">
    <div class="lbl"><span>Leg chance: lowest</span><b class="num" id="mv">${pct(MINP)}</b></div>
    <input type="range" min="0.5" max="0.93" step="0.01" value="${MINP}" id="minp">
    <div class="lbl"><span>Leg chance: highest</span><b class="num" id="xv">${pct(MAXP)}</b></div>
    <input type="range" min="0.6" max="0.97" step="0.01" value="${MAXP}" id="maxp">
    <button class="primary dice" id="roll">🎲 Roll a parlay</button>
  </div>
  <div id="rand">${RAND ? `<div class="card">${RAND.html}</div>` : ""}</div>`;
  const top = inRange.slice().sort((a,b) => rate(b) - rate(a));
  html += `<h2>All legs in the next ${WINDOW_H}h (${top.length})</h2><div class="card">${top.slice(0, 60).map(legRow).join("") || `<div class="dim small">No legs start in the next ${WINDOW_H} hours with the current filters.</div>`}</div>
  <div class="foot">Only games starting in the next ${WINDOW_H} hours (from each sport's latest scan) are used, and nothing starting in the next ${MIN_LEAD_MIN} minutes. Data rescans every hour.<br>
  🎾⚽ Tennis and soccer legs use Kalshi's current ask, so payouts and EV are real until prices move. Soccer chances blend the model 50/50 with Kalshi's own price. 🏀🏈 Player props use projected starters only; their payout is an estimate (fair price minus about 5%), so check Kalshi's combo price. Each parlay uses one leg per game, and legs are treated as independent.<br>
  Model details: <a href="nfl.html">NFL</a> · <a href="nba.html">NBA</a> · <a href="tennis.html">Tennis</a></div>`;
  $("#app").innerHTML = html;
}
function rollCustom(){
  const P = build({minP: MINP, maxP: MAXP, target: TARGET, n: 15}, true);
  if (!P) return null;
  const txt = P.legs.map(L => `${ICON[L.sport]} ${L.title}`).join("\n");
  return {html: `<div class="pc-head"><div><div class="hd" style="font-weight:800">🎲 Your random parlay · ${P.legs.length} legs</div><div class="s small dim">Legs ${pct(MINP)}–${pct(MAXP)}, weighted toward the strongest</div></div>
    <div style="text-align:right"><div class="mult num">${P.mult.toFixed(2)}×</div><div class="tiny dim">${P.priced ? "at Kalshi asks" : "estimated payout"}</div></div></div>
    <div class="row" style="gap:6px;margin:8px 0 2px"><span class="tag">Model hit chance ${pct(P.p)}</span></div>
    ${P.legs.map(legRow).join("")}<div class="btns"><button id="roll2">🎲 Roll again</button><button data-copy="${esc(txt)}">Copy legs</button></div>`};
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-sport],[data-mode],[data-reroll],#roll,#roll2,#reload,[data-copy]"); if (!t) return;
  if (t.dataset.mode){ MODE = t.dataset.mode; store.set("bot.mode", MODE); rebuild(); ROLL = {}; RAND = null; render(); }
  else if (t.dataset.sport){ SPORTS[t.dataset.sport] = !SPORTS[t.dataset.sport]; store.set("bot.sports", SPORTS); ROLL = {}; RAND = null; render(); }
  else if (t.dataset.reroll){ const k = t.dataset.reroll; const P = build(TIERS[k].opt(), true); if (P){ ROLL[k] = P; render(); } else toast("No other combo fits"); }
  else if (t.id === "roll" || t.id === "roll2"){ RAND = rollCustom(); if (!RAND) toast("No combo hits that target, so try a wider chance range"); render(); document.getElementById("rand").scrollIntoView({behavior:"smooth", block:"start"}); }
  else if (t.id === "reload"){ toast("Checking for new data"); load(); }
  else if (t.dataset.copy){ navigator.clipboard?.writeText(t.dataset.copy).then(() => toast("Copied"), () => toast("Copy not allowed here")); }
});
document.addEventListener("input", e => {
  if (e.target.id === "lotto"){ LOTTO_N = Number(e.target.value); store.set("bot.lotto", LOTTO_N); $("#lv").textContent = LOTTO_N; }
  if (e.target.id === "target"){ TARGET = Number(e.target.value); store.set("picks.target", TARGET); $("#tv").textContent = TARGET.toFixed(2) + "×"; }
  if (e.target.id === "minp"){ MINP = Math.min(Number(e.target.value), MAXP - .02); store.set("picks.min2", MINP); $("#mv").textContent = pct(MINP); }
  if (e.target.id === "maxp"){ MAXP = Math.max(Number(e.target.value), MINP + .02); store.set("picks.max2", MAXP); $("#xv").textContent = pct(MAXP); }
});
document.addEventListener("change", e => { if (["lotto","minp","maxp","target"].includes(e.target.id)){ if (e.target.id === "lotto") delete ROLL.lotto; RAND = null; render(); } });

function rebuild(){
  LEGS = [...(DATA.tennis ? tennisLegs(DATA.tennis) : []), ...(DATA.soccer ? soccerLegs(DATA.soccer) : []),
          ...(DATA.nba ? propLegs(DATA.nba, "nba") : []), ...(DATA.nfl ? propLegs(DATA.nfl, "nfl") : [])];
}
async function load(){
  const get = f => fetch(f + "?t=" + Date.now(), {cache:"no-store"}).then(r => r.ok ? r.json() : null).catch(() => null);
  const [tennis, soccer, nba, nfl] = await Promise.all([get("tennis.json"), get("soccer.json"), get("nba.json"), get("data.json")]);
  const prev = Object.values(DATA).map(d => d?.generated).join();
  DATA = {tennis, soccer, nba, nfl};
  if (Object.values(DATA).map(d => d?.generated).join() !== prev){ ROLL = {}; RAND = null; }
  rebuild();
  const times = Object.values(DATA).filter(Boolean).map(d => d.generated).sort();
  $("#updated").textContent = `${LEGS.length} legs from games in the next ${WINDOW_H}h · last scan ${times.length ? ago(times[times.length-1]) : "—"} · rescans hourly`;
  $("#scan").innerHTML = ["nfl","nba","tennis","soccer"].map(s => DATA[s] ? `<span class="${Date.now() - new Date(DATA[s].generated) > 2.5*3600e3 ? "old" : ""}">${ICON[s]} ${ago(DATA[s].generated)}</span>` : `<span class="old">${ICON[s]} no data</span>`).join("");
  render();
}
load();
setInterval(load, 10 * 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
