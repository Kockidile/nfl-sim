name: Update NFL data

on:
  schedule:
    - cron: "17 */3 * * *"        # every 3 hours
    - cron: "47 15-23 * * 0"      # hourly on Sundays (US game day, UTC) for inactives
    - cron: "47 22-23 * * 1,4"    # Monday & Thursday night games
  workflow_dispatch: {}           # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # always start from the latest code, even on "Re-run"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore ESPN box-score cache
        uses: actions/cache@v4
        with:
          path: ~/.nfl_sim_cache
          key: espn-${{ github.run_id }}
          restore-keys: espn-
      - name: Build data.json
        run: python -m nfl_sim -q export --out docs/data.json
      - name: Commit
        run: |
          git config user.name "nfl-sim-bot"
          git config user.email "nfl-sim-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
