name: Tennis discover (one-off)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { ref: main }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python tennis_sim/discover.py
      - run: |
          git config user.name "nfl-sim-bot"; git config user.email "nfl-sim-bot@users.noreply.github.com"
          git add debug; git commit -m "tennis discovery samples" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
